name = "hdm-api"
main = "src/index.ts"
# nodejs_compat + compatibility_date >= 2025-02-04: required by `pg` (node-postgres) over Hyperdrive.
compatibility_date = "2025-02-04"
compatibility_flags = ["nodejs_compat"]

# Secrets (set with `wrangler secret put <NAME>`):
#   INTERNAL_SECRET, TICKET_SECRET, FIREBASE_SA_JSON
#   HIVE_DML_KEY: only for the HornetHive REST fallback (used when no HYPERDRIVE binding is configured)

# Database: Cloudflare Hyperdrive in front of the HornetHive POOLED connection string
# (PgBouncer transaction mode, port 6432, sslmode=require). Create it with query caching DISABLED:
#   npx wrangler hyperdrive create hdm-db --connection-string="<HIVE_PG_URL>" --caching-disabled
# then put the printed id below. Remove this block to fall back to the REST API (needs HIVE_DML_KEY).
# Local `wrangler dev` with this block needs a local Postgres string: either add
#   localConnectionString = "postgres://..."   (never commit a real one)
# here, or set the env var CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE before `npx wrangler dev`.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "d39dc734f5e34c2fa1209cdd6fad9366"

# Keep the HornetHive database awake (see scheduled() in src/index.ts).
[triggers]
crons = ["*/5 * * * *"]

[vars]
# REST fallback only (ignored while HYPERDRIVE is bound).
HIVE_API_BASE = "https://api.hornethive.io/v1"
HIVE_DB_ID = "REPLACE_WITH_DB_ID"
FIREBASE_PROJECT_ID = "hdm-prod"
# Prod: the Blogspot origin ONLY (scheme + host, no path, no trailing slash). Comma-separate extra origins
# (e.g. a custom domain). Do not add http://localhost here for the deployed Worker.
ALLOWED_ORIGINS = "https://hdmbooster.blogspot.com"
GAS_URL = "https://script.google.com/macros/s/AKfycbxW-8cqQ9lNL8fl1f9g_fWHsOEIHytP9byKMwP8eHOLO3Udeh4f7KUmAXHzfJnC3p8/exec"
